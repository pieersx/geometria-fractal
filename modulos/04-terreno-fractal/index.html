<body>

    Zoom <b id="sZoom">1×</b> · <span id="sFps"></span>

<script>
"use strict";
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: true });
let ctxLost = false;
canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); ctxLost = true; const n = document.getElementById("nogl"); n.textContent = "Se perdió el contexto gráfico. Recarga la página."; n.style.display = "grid"; document.getElementById("panel").style.display = "none"; });

if (!gl) {
  document.getElementById("nogl").style.display = "grid";
  document.getElementById("panel").style.display = "none";
  throw new Error("WebGL no disponible");
}
const uintExt = gl.getExtension("OES_element_index_uint");
const MAX_DETAIL = uintExt ? 9 : 7;      // 513×513 si hay índices de 32 bits; si no, 129×129
const detailInput = document.getElementById("detail");
detailInput.max = MAX_DETAIL;
if (+detailInput.value > MAX_DETAIL) detailInput.value = MAX_DETAIL;

/* ---------- Shaders ---------- */
const SKY_FN = `
uniform vec3 uSun, uSunCol, uSkyTop, uSkyHor;
vec3 skyColor(vec3 d) {
  float t = clamp(d.y, 0.0, 1.0);
  vec3 c = mix(uSkyHor, uSkyTop, smoothstep(0.0, 0.8, t));
  float s = max(dot(d, uSun), 0.0);
  c += uSunCol * (pow(s, 900.0) * 2.0 + pow(s, 40.0) * 0.30 + pow(s, 6.0) * 0.12);
  return c;
}`;

const PRECISION = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif`;

const SKY_VS = `attribute vec2 p; varying vec2 vUv;
void main(){ vUv = p; gl_Position = vec4(p, 1.0, 1.0); }`;

const SKY_FS = PRECISION + `
varying vec2 vUv;
uniform vec3 uRight, uUp, uFwd;
uniform float uTanY, uAspect;
${SKY_FN}
void main() {
  vec3 d = normalize(uFwd + vUv.x * uAspect * uTanY * uRight + vUv.y * uTanY * uUp);
  gl_FragColor = vec4(skyColor(d), 1.0);
}`;

const TER_VS = `
attribute vec3 aPos;      // x, altura normalizada (0..1), z
attribute vec2 aGrad;     // dh/dx, dh/dz
uniform mat4 uVP;
uniform float uScale, uWater;
varying vec3 vWorld; varying float vH; varying vec2 vGrad; varying vec2 vXZ;
void main() {
  vec3 w = vec3(aPos.x, max(aPos.y, uWater) * uScale, aPos.z);
  vWorld = w; vH = aPos.y; vGrad = aGrad; vXZ = aPos.xz;
  gl_Position = uVP * vec4(w, 1.0);
}`;

const TER_FS = PRECISION + `
varying vec3 vWorld; varying float vH; varying vec2 vGrad; varying vec2 vXZ;
uniform vec3 uEye;
uniform float uScale, uWater, uTime, uMesh, uGridN, uFog, uSunI, uEdge, uSq;
uniform vec3 uL0, uL1, uL2, uL3, uL4, uL5, uWShallow, uWDeep;
${SKY_FN}

void main() {
  vec3 Vv = uEye - vWorld;
  float dist = length(Vv);
  vec3 V = Vv / dist;
  vec3 N = normalize(vec3(-vGrad.x * uScale, 1.0, -vGrad.y * uScale));
  vec3 col;

  if (vH <= uWater) {
    // Agua: oleaje barato, color por profundidad, reflejo del cielo y espuma en la orilla.
    vec2 p = vXZ * 20.0;
    vec2 d1 = vec2(0.83, 0.55), d2 = vec2(-0.36, 0.93), d3 = vec2(0.97, -0.24), d4 = vec2(-0.71, -0.70);
    float w1 = cos(dot(p, d1) * 2.3 + uTime * 1.1), w2 = cos(dot(p, d2) * 3.7 - uTime * 0.9);
    float w3 = cos(dot(p, d3) * 5.9 + uTime * 1.6), w4 = cos(dot(p, d4) * 8.3 - uTime * 1.3);
    vec2 rip = (d1 * w1 * 0.5 + d2 * w2 * 0.35 + d3 * w3 * 0.2 + d4 * w4 * 0.12) * 0.045 / (1.0 + dist * 0.6);
    vec3 Nw = normalize(vec3(rip.x, 1.0, rip.y));
    float depth = clamp((uWater - vH) / max(uWater, 0.001), 0.0, 1.0);
    vec3 base = mix(uWShallow, uWDeep, pow(depth, 0.55));
    float fres = 0.04 + 0.9 * pow(1.0 - max(dot(Nw, V), 0.0), 4.0);
    vec3 R = reflect(-V, Nw);
    vec3 refl = skyColor(vec3(R.x, abs(R.y), R.z));
    col = mix(base * (0.45 + 0.55 * uSunI), refl, fres);
    col += uSunCol * pow(max(dot(R, uSun), 0.0), 260.0) * 0.9 * uSunI;
    float shore = uWater - vH;
    float foam = smoothstep(0.035, 0.0, shore) * (0.55 + 0.45 * sin(shore * 220.0 - uTime * 1.8));
    col = mix(col, vec3(1.0), clamp(foam, 0.0, 1.0) * 0.55 * uSunI);
  } else {
    float t = clamp((vH - uWater) / max(1.0 - uWater, 0.001), 0.0, 1.0);
    vec3 c = uL0;
    c = mix(c, uL1, smoothstep(0.00, 0.18, t));
    c = mix(c, uL2, smoothstep(0.14, 0.38, t));
    c = mix(c, uL3, smoothstep(0.34, 0.60, t));
    c = mix(c, uL4, smoothstep(0.56, 0.80, t));
    float slope = 1.0 - N.y;
    c = mix(c, uL4, smoothstep(0.30, 0.62, slope) * (1.0 - smoothstep(0.80, 0.95, t)));
    float snow = smoothstep(0.72, 0.88, t) * (1.0 - smoothstep(0.34, 0.64, slope));
    c = mix(c, uL5, snow);
    float diff = max(dot(N, uSun), 0.0);
    vec3 amb = mix(vec3(0.30, 0.28, 0.26), uSkyTop * 0.5 + 0.38, N.y * 0.5 + 0.5) * (0.6 + 0.4 * uSunI);
    col = c * (amb + uSunCol * diff * 1.05 * uSunI);
    if (uMesh > 0.5) {
      vec2 g = fract((vXZ * 0.5 + 0.5) * uGridN);
      float e = min(min(g.x, 1.0 - g.x), min(g.y, 1.0 - g.y));
      float line = (1.0 - smoothstep(0.0, 0.07, e)) * (1.0 - smoothstep(1.4, 3.2, dist));
      col = mix(col, vec3(0.04, 0.06, 0.08), line * 0.6);
    }
  }

  // Niebla atmosférica y desvanecido del borde del mapa hacia el horizonte.
  vec3 fogC = skyColor(-V);
  float ed = mix(length(vXZ), max(abs(vXZ.x), abs(vXZ.y)), uSq);
  float edge = smoothstep(uEdge, uEdge + 0.42, ed);
  float f = clamp(1.0 - exp(-pow(dist * uFog, 2.0)) + edge, 0.0, 1.0);
  col = mix(col, fogC, f);
  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function uniforms(p, names) {
  const o = {};
  for (const n of names) o[n] = gl.getUniformLocation(p, n);
  return o;
}

const skyProg = program(SKY_VS, SKY_FS);
const terProg = program(TER_VS, TER_FS);
const SKY_COMMON = ["uSun", "uSunCol", "uSkyTop", "uSkyHor"];
const skyU = uniforms(skyProg, [...SKY_COMMON, "uRight", "uUp", "uFwd", "uTanY", "uAspect"]);
const terU = uniforms(terProg, [...SKY_COMMON, "uVP", "uEye", "uScale", "uWater", "uTime", "uMesh",
  "uGridN", "uFog", "uSunI", "uEdge", "uSq", "uL0", "uL1", "uL2", "uL3", "uL4", "uL5", "uWShallow", "uWDeep"]);

/* Triángulo a pantalla completa para el cielo */
const skyBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const skyLoc = gl.getAttribLocation(skyProg, "p");
const aPos = gl.getAttribLocation(terProg, "aPos");
const aGrad = gl.getAttribLocation(terProg, "aGrad");

/* ---------- Generación del terreno (diamond-square) ---------- */
function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function diamondSquare(n, r, seed) {
  const N = 1 << n, S = N + 1;
  const m = new Float32Array(S * S);
  const rnd = mulberry32(seed);
  const at = (x, z) => m[z * S + x];
  for (const z of [0, N]) for (const x of [0, N]) m[z * S + x] = rnd() - 0.5;
  let amp = 1;
  for (let step = N; step > 1; step >>= 1) {
    const half = step >> 1;
    for (let z = half; z < N; z += step) {
      for (let x = half; x < N; x += step) {
        m[z * S + x] = (at(x - half, z - half) + at(x + half, z - half) +
                        at(x - half, z + half) + at(x + half, z + half)) / 4 + (rnd() - 0.5) * amp;
      }
    }
    for (let z = 0; z <= N; z += half) {
      const off = (z % step === 0) ? half : 0;
      for (let x = off; x <= N; x += step) {
        let s = 0, c = 0;
        if (x - half >= 0) { s += at(x - half, z); c++; }
        if (x + half <= N) { s += at(x + half, z); c++; }
        if (z - half >= 0) { s += at(x, z - half); c++; }
        if (z + half <= N) { s += at(x, z + half); c++; }
        m[z * S + x] = s / c + (rnd() - 0.5) * amp;
      }
    }
    amp *= r;
  }
  return m;
}

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

const mesh = { n: -1, count: 0, vbo: gl.createBuffer(), ibo: gl.createBuffer(), N: 0 };

function buildTerrain(n, r, seed, island) {
  const N = 1 << n, S = N + 1;
  const h = diamondSquare(n, r, seed);
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < h.length; i++) { if (h[i] < lo) lo = h[i]; if (h[i] > hi) hi = h[i]; }
  const span = hi - lo || 1;
  for (let z = 0; z < S; z++) {
    for (let x = 0; x < S; x++) {
      let v = Math.pow((h[z * S + x] - lo) / span, 1.4);
      if (island) {
        const px = x / N * 2 - 1, pz = z / N * 2 - 1;
        v *= smooth(1.12, 0.5, Math.hypot(px, pz));
      }
      h[z * S + x] = v;
    }
  }
  const dx = 2 / N;
  const data = new Float32Array(S * S * 5);
  for (let z = 0; z < S; z++) {
    for (let x = 0; x < S; x++) {
      const i = z * S + x, o = i * 5;
      const xl = Math.max(x - 1, 0), xr = Math.min(x + 1, N), zu = Math.max(z - 1, 0), zd = Math.min(z + 1, N);
      data[o] = x / N * 2 - 1;
      data[o + 1] = h[i];
      data[o + 2] = z / N * 2 - 1;
      data[o + 3] = (h[z * S + xr] - h[z * S + xl]) / ((xr - xl) * dx);
      data[o + 4] = (h[zd * S + x] - h[zu * S + x]) / ((zd - zu) * dx);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  if (mesh.n !== n) {
    const idx = uintExt ? new Uint32Array(N * N * 6) : new Uint16Array(N * N * 6);
    let k = 0;
    for (let z = 0; z < N; z++) {
      for (let x = 0; x < N; x++) {
        const a = z * S + x, b = a + 1, c = a + S, d = c + 1;
        idx[k++] = a; idx[k++] = c; idx[k++] = b;
        idx[k++] = b; idx[k++] = c; idx[k++] = d;
      }
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    mesh.n = n; mesh.count = idx.length; mesh.N = N;
  }
}

/* ---------- Paletas ---------- */
const PALETTES = {
  alpine: { land: [[.78,.72,.52],[.32,.56,.25],[.20,.42,.22],[.50,.46,.32],[.52,.50,.48],[.96,.97,1]],
            wS: [.18,.62,.66], wD: [.03,.17,.32], top: [.14,.34,.78], hor: [.68,.80,.93], sun: [1,.92,.75] },
  desert: { land: [[.93,.80,.55],[.86,.62,.34],[.74,.45,.25],[.60,.33,.22],[.42,.25,.20],[.95,.86,.72]],
            wS: [.25,.65,.62], wD: [.04,.25,.33], top: [.30,.45,.78], hor: [.98,.78,.55], sun: [1,.85,.6] },
  violet: { land: [[.55,.45,.70],[.40,.30,.62],[.28,.20,.50],[.50,.35,.65],[.34,.26,.46],[.97,.90,1]],
            wS: [.35,.35,.78], wD: [.07,.06,.25], top: [.10,.07,.30], hor: [.75,.45,.70], sun: [1,.7,.85] },
  arctic: { land: [[.80,.85,.88],[.62,.72,.78],[.45,.58,.68],[.62,.68,.75],[.40,.45,.52],[1,1,1]],
            wS: [.30,.65,.78], wD: [.04,.20,.38], top: [.25,.45,.75], hor: [.85,.92,.98], sun: [1,.95,.9] },
};

const PRESETS = [
  { seed: 4817, rough: 0.59, water: 0.30, pal: "alpine", sun: 30, height: 1.0, island: true },
  { seed: 2026, rough: 0.52, water: 0.34, pal: "alpine", sun: 42, height: 1.0, island: true },
  { seed: 99,   rough: 0.50, water: 0.00, pal: "desert", sun: 14, height: 1.3, island: true },
  { seed: 31337, rough: 0.62, water: 0.45, pal: "violet", sun: 9, height: 1.2, island: true },
  { seed: 777,  rough: 0.55, water: 0.40, pal: "arctic", sun: 24, height: 1.1, island: true },
];

/* ---------- Estado e interfaz ---------- */
const $ = id => document.getElementById(id);
const ui = { rough: $("rough"), height: $("height"), water: $("water"), sun: $("sun"), detail: $("detail"),
  seed: $("seed"), island: $("island"), mesh: $("mesh"), orbit: $("orbit"), pal: $("pal"), presets: $("presets") };
const reducedMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reducedMotion) ui.orbit.checked = false;

const DEFAULT_CAM = { yaw: 0.75, pitch: 0.38, dist: 1.85 };
const cam = { ...DEFAULT_CAM };
let lastTouch = -1e9;

function rebuild() {
  const r = ui.rough.valueAsNumber;
  buildTerrain(+ui.detail.value, r, ui.seed.valueAsNumber >>> 0, ui.island.checked);
  const side = (1 << +ui.detail.value) + 1;
  $("sMesh").textContent = side + " × " + side + " · " + (mesh.count / 3).toLocaleString("es") + " triángulos";
  $("vDetail").textContent = side + " × " + side;
  $("vRough").textContent = r.toFixed(2);
  const H = -Math.log2(r);
  $("sH").textContent = H.toFixed(2);
  $("sD").textContent = (3 - Math.min(H, 1)).toFixed(2);
}
function refreshLabels() {
  $("vHeight").textContent = ui.height.valueAsNumber.toFixed(2) + "×";
  $("vWater").textContent = Math.round(ui.water.valueAsNumber * 100) + " %";
  $("vSun").textContent = ui.sun.value + "°";
}

let pending = false;
function scheduleRebuild() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; rebuild(); });
}

["rough", "detail", "island"].forEach(k => ui[k].addEventListener("input", scheduleRebuild));
ui.island.addEventListener("change", scheduleRebuild);
["height", "water", "sun"].forEach(k => ui[k].addEventListener("input", refreshLabels));
ui.seed.addEventListener("change", () => {
  const v = Math.trunc(ui.seed.valueAsNumber || 0);
  ui.seed.value = Math.min(4294967295, Math.max(0, v));
  rebuild();
});
$("random").addEventListener("click", () => {
  ui.seed.value = Math.floor(Math.random() * 4294967296);
  rebuild();
});
ui.presets.addEventListener("change", () => {
  const p = PRESETS[+ui.presets.value];
  ui.seed.value = p.seed; ui.rough.value = p.rough; ui.water.value = p.water; ui.pal.value = p.pal;
  ui.sun.value = p.sun; ui.height.value = p.height; ui.island.checked = p.island;
  refreshLabels(); rebuild();
});
$("reset").addEventListener("click", () => { Object.assign(cam, DEFAULT_CAM); lastTouch = performance.now(); });
$("shot").addEventListener("click", () => {
  render(performance.now());
  const a = document.createElement("a");
  a.download = "terreno-fractal-" + ui.seed.value + ".png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});

/* ---------- Cámara e interacción ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function orbit(dx, dy) { cam.yaw += dx; cam.pitch = clamp(cam.pitch + dy, 0.10, 1.45); lastTouch = performance.now(); }
function zoom(f) { cam.dist = clamp(cam.dist * f, 0.7, 4.5); lastTouch = performance.now(); }

const pointers = new Map();
let pinch = 0;
canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("dragging");
  canvas.focus({ preventScroll: true });
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener("pointermove", e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) orbit(-dx * 0.008, dy * 0.006);
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch > 0 && d > 0) zoom(pinch / d);
    pinch = d;
  }
});
const endPointer = e => { pointers.delete(e.pointerId); if (!pointers.size) canvas.classList.remove("dragging"); pinch = 0; };
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1);   // Firefox envía líneas, no píxeles
  zoom(Math.exp(clamp(dy, -120, 120) * 0.0015));
}, { passive: false });
canvas.addEventListener("keydown", e => {
  switch (e.key) {
    case "ArrowLeft": orbit(-0.1, 0); break;
    case "ArrowRight": orbit(0.1, 0); break;
    case "ArrowUp": orbit(0, 0.08); break;
    case "ArrowDown": orbit(0, -0.08); break;
    case "+": case "=": zoom(1 / 1.12); break;
    case "-": zoom(1.12); break;
    default: return;
  }
  e.preventDefault();
});

/* ---------- Matrices ---------- */
function perspective(fovy, aspect, n, f) {
  const t = 1 / Math.tan(fovy / 2), nf = 1 / (n - f);
  return [t / aspect, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0];
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(...a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
function lookAt(eye, target) {
  const f = norm(sub(target, eye)), r = norm(cross(f, [0, 1, 0])), u = cross(r, f);
  return { f, r, u, m: [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0,
    -dot(r, eye), -dot(u, eye), dot(f, eye), 1] };
}
function mul(a, b) {
  const o = new Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  }
  return o;
}
const mixv = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

/* ---------- Dibujo ---------- */
const FOV = 50 * Math.PI / 180;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

function render(now) {
  resize();
  gl.viewport(0, 0, canvas.width, canvas.height);
  const aspect = canvas.width / canvas.height;
  const target = [0, 0.1, 0];
  const eye = [target[0] + cam.dist * Math.cos(cam.pitch) * Math.sin(cam.yaw),
               target[1] + cam.dist * Math.sin(cam.pitch),
               target[2] + cam.dist * Math.cos(cam.pitch) * Math.cos(cam.yaw)];
  const view = lookAt(eye, target);
  const vp = mul(perspective(FOV, aspect, 0.03, 30), view.m);

  // Cielo y luz según la altura del sol
  const pal = PALETTES[ui.pal.value];
  const elev = +ui.sun.value * Math.PI / 180, az = -0.3;
  const sun = [Math.cos(elev) * Math.sin(az), Math.sin(elev), Math.cos(elev) * Math.cos(az)];
  const warm = clamp(1 - +ui.sun.value / 38, 0, 1);
  const top = mixv(pal.top, pal.top.map(v => v * 0.4), warm * 0.6);
  const hor = mixv(pal.hor, [1.0, 0.52, 0.30], warm * 0.4);
  const sunCol = mixv(pal.sun, [1, 0.5, 0.25], warm * 0.6);
  const sunI = 0.35 + 0.65 * smooth(0.03, 0.5, Math.sin(elev));
  const setSky = U => {
    gl.uniform3fv(U.uSun, sun); gl.uniform3fv(U.uSunCol, sunCol);
    gl.uniform3fv(U.uSkyTop, top); gl.uniform3fv(U.uSkyHor, hor);
  };

  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(skyProg);
  setSky(skyU);
  gl.uniform3fv(skyU.uRight, view.r); gl.uniform3fv(skyU.uUp, view.u); gl.uniform3fv(skyU.uFwd, view.f);
  gl.uniform1f(skyU.uTanY, Math.tan(FOV / 2)); gl.uniform1f(skyU.uAspect, aspect);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf);
  gl.enableVertexAttribArray(skyLoc);
  gl.vertexAttribPointer(skyLoc, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disableVertexAttribArray(skyLoc);

  gl.enable(gl.DEPTH_TEST);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(terProg);
  setSky(terU);
  gl.uniformMatrix4fv(terU.uVP, false, vp);
  gl.uniform3fv(terU.uEye, eye);
  gl.uniform1f(terU.uScale, 0.62 * ui.height.valueAsNumber);
  gl.uniform1f(terU.uWater, ui.water.valueAsNumber);
  gl.uniform1f(terU.uTime, reducedMotion ? 0 : now / 1000);
  gl.uniform1f(terU.uMesh, ui.mesh.checked ? 1 : 0);
  gl.uniform1f(terU.uGridN, mesh.N);
  gl.uniform1f(terU.uFog, 0.20);
  gl.uniform1f(terU.uSunI, sunI);
  gl.uniform1f(terU.uEdge, ui.island.checked ? 0.58 : 0.72);
  gl.uniform1f(terU.uSq, ui.island.checked ? 0 : 1);
  pal.land.forEach((c, i) => gl.uniform3fv(terU["uL" + i], c));
  gl.uniform3fv(terU.uWShallow, pal.wS); gl.uniform3fv(terU.uWDeep, pal.wD);
  gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vbo);
  gl.enableVertexAttribArray(aPos); gl.enableVertexAttribArray(aGrad);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 20, 0);
  gl.vertexAttribPointer(aGrad, 2, gl.FLOAT, false, 20, 12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.ibo);
  gl.drawElements(gl.TRIANGLES, mesh.count, uintExt ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);
  gl.disableVertexAttribArray(aPos); gl.disableVertexAttribArray(aGrad);

  $("sZoom").textContent = (DEFAULT_CAM.dist / cam.dist).toFixed(1) + "×";
}

let prev = performance.now(), frames = 0, acc = 0;
function loop(now) {
  if (ctxLost) return;                                     // contexto perdido: se detiene el bucle
  const dt = Math.min((now - prev) / 1000, 0.1);
  prev = now;
  if (ui.orbit.checked && now - lastTouch > 2500) cam.yaw += dt * 0.07;
  render(now);
  frames++; acc += dt;
  if (acc >= 0.5) { $("sFps").textContent = Math.round(frames / acc) + " fps"; frames = 0; acc = 0; }
  requestAnimationFrame(loop);
}

refreshLabels();
rebuild();
requestAnimationFrame(loop);
</script>
</body>
</html>
